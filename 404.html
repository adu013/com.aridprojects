<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .error-container {
            max-width: 500px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .redirect-notice {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 1.5rem;
            border-top: 1px dashed var(--border);
            padding-top: 1.5rem;
        }

        .countdown {
            color: var(--accent);
            font-weight: 600;
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            display: inline-block;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The routing path you specified does not exist or has been terminated permanently.</p>

        <a href="/" class="btn">Return to Home &rarr;</a>

        <div class="redirect-notice">
            Auto-routing back home in <span id="timer" class="countdown">10</span> seconds...
        </div>
    </div>

    <!-- Automatic Back-to-Home Redirect Script -->
    <script>
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = '/';
            }
        }, 1000);
    </script>

</body>
</html>
